# HTTPS 인증서 발급 전에만 쓰는 임시 설정.
# certbot 이 /.well-known/acme-challenge/ 를 읽어갈 수 있게만 열어둔다.
# 발급이 끝나면 iread.conf 로 교체한다.

server {
    listen 80;
    listen [::]:80;
    server_name i15b105.p.ssafy.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "iread bootstrap\n";
        add_header Content-Type text/plain;
    }
}
