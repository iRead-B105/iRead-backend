# iRead 운영 nginx 설정. 서버 배치 경로: /etc/nginx/sites-available/iread
#
# 주의: Gerrit 이 Apache(8989) 뒤에서 돌고 있다. 이 파일은 80/443 만 다루며
#       8989 는 절대 건드리지 않는다.
#
# 정적 파일 배치
#   /opt/iread/web/teacher/   교사용 웹 UI (iRead-frontend 빌드 산출물)
#   /opt/iread/download/      아이용 Electron 설치 파일 (.exe, 약 146MB)

# HTTP 는 인증서 갱신 경로만 남기고 전부 HTTPS 로 보낸다.
server {
    listen 80;
    listen [::]:80;
    server_name i15b105.p.ssafy.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 문법. `http2 on;` 은 1.25.1 이상에서만 쓸 수 있다.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name i15b105.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/i15b105.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i15b105.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 백엔드 multipart 한도가 파일 20MB / 요청 21MB 이므로 그보다 넉넉히 준다.
    # 기본값 1MB 로 두면 음성 업로드가 413 으로 실패한다.
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root /opt/iread/web/teacher;
    index index.html;

    # ---- 백엔드 프록시 ----
    # ai.read-timeout 이 210s 라서 이미지·이야기 생성이 최대 3분 반 걸릴 수 있다.
    # nginx 기본 60s 로 두면 생성 요청이 504 로 끊긴다.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    240s;
        proxy_read_timeout    240s;
        proxy_buffering off;
    }

    # 백엔드가 WebConfig 로 노출하는 업로드 이미지 (app.file-storage.local.public-url)
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 시선 데이터 (app.gaze-storage.local.public-url)
    location /gaze/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # API 문서. 공개 서버에 API 표면을 그대로 노출하는 것이므로
    # 시연 후 닫으려면 이 블록만 지우면 된다.
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # actuator 는 배포 스크립트가 서버 안에서 127.0.0.1 로만 호출하므로 외부에 열지 않는다.
    location /actuator {
        return 404;
    }

    # ---- 아이용 앱 설치 파일 ----
    location /download/ {
        alias /opt/iread/download/;
        autoindex off;
        default_type application/octet-stream;
        gzip off;
        add_header Cache-Control "public, max-age=300";
    }

    # ---- 아동용 웹 UI (브라우저에서 Tobii 없이 시연할 때 쓴다) ----
    # 라우트가 이미 /learner/... 이고 라우터가 createWebHistory(BASE_URL) 을 쓰므로
    # vite base 는 반드시 '/' 로 빌드해야 한다. '/learner/' 로 주면 /learner/learner/... 가 된다.
    # 그래서 정적 자산 경로(/assets, /images)가 교사 앱과 겹치는데, 해시 파일명이라
    # assets 충돌은 0건이고 겹치는 이미지 3개는 아동 앱이 참조하지 않는다.
    location ^~ /learner {
        try_files $uri @learner_index;
    }

    location @learner_index {
        root /opt/iread/web/learner;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    # 교사 앱에서 못 찾은 정적 파일은 아동 앱 쪽에서 찾는다.
    location @learner_static {
        root /opt/iread/web/learner;
        try_files $uri =404;
    }

    # ---- 교사용 웹 UI (Vue SPA) ----
    # 해시가 붙은 산출물은 길게 캐시한다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @learner_static;
    }

    location /images/ {
        expires 7d;
        try_files $uri @learner_static;
    }

    # createWebHistory 를 쓰므로 새로고침 시 404 가 나지 않도록 index.html 로 넘긴다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
