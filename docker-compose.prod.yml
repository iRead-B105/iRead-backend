# EC2 운영용. 로컬 개발은 docker-compose.yml 을 그대로 쓴다(이 파일은 로컬에서 쓰지 않는다).
#
# 서버 배치:
#   /opt/iread/docker-compose.prod.yml   <- 이 파일
#   /opt/iread/.env                      <- 시크릿 (git에 절대 넣지 않음, compose가 자동 로드)
#   /opt/iread/lexicon/                  <- story-lexicon.sqlite3 (수동 업로드, 없으면 기능만 비활성)
#
# 실행: cd /opt/iread && docker compose -f docker-compose.prod.yml up -d
#
# 설계 원칙
#  - MySQL·Redis·AI는 포트를 발행하지 않는다. Docker는 ufw를 우회하므로 발행하면 인터넷에 열린다.
#  - 백엔드만 127.0.0.1:8080 에 붙여 호스트 nginx가 프록시한다.
#  - 필수 시크릿은 ${VAR:?} 로 선언해 값이 없으면 기동 전에 실패하게 한다.

name: iread

services:
  mysql:
    image: mysql:8.4
    container_name: iread-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-iread}
      MYSQL_USER: ${MYSQL_USER:-iread}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 를 .env 에 설정해야 한다}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 를 .env 에 설정해야 한다}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 램이 15GB 중 11GB 이상 남으므로 기본 128MB에서 올린다.
      - --innodb-buffer-pool-size=2G
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 3g

  redis:
    image: redis:7.4-alpine
    container_name: iread-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 를 .env 에 설정해야 한다}
      TZ: Asia/Seoul
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  ai:
    image: ghcr.io/iread-b105/iread-ai:${AI_TAG:-latest}
    container_name: iread-ai
    restart: unless-stopped
    # 외부에 노출하지 않는다. 백엔드만 compose 네트워크로 호출한다.
    #
    # AI 설정 항목을 compose 에 하나씩 나열하지 않고 팀의 .env 를 그대로 넘긴다.
    # 나열 방식은 새 항목이 생길 때 조용히 기본값으로 떨어지는데, 그 기본값이
    # 대개 mock/deterministic 이라 "화면은 정상인데 결과가 가짜"가 된다.
    # 실제로 AI_PRONUNCIATION_PROVIDER 와 AI_SPEECH_PROVIDER 의 기본값이
    # deterministic 이고 여기엔 production 가드도 없다.
    env_file:
      - ./ai.env
    environment:
      # env_file 보다 우선한다. 운영에서 반드시 고정해야 하는 값만 둔다.
      TZ: Asia/Seoul
      # production 이면 mock provider 와 기본 내부키를 거부한다(config.py validate_runtime).
      APP_ENV: production
      # 백엔드의 AI_API_KEY 와 같은 값이어야 하므로 .env 한 곳에서만 관리한다.
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY:?AI_INTERNAL_API_KEY 를 .env 에 설정해야 한다}
      # 없으면 lexiconStatus=UNAVAILABLE 로 뜨고 나머지 기능은 정상 동작한다.
      AI_LEXICON_DB_PATH: /app/lexicon/story-lexicon.sqlite3
    volumes:
      - ./lexicon:/app/lexicon:ro
    # 헬스체크는 이미지에 정의된 것을 그대로 쓴다(/health).
    mem_limit: 2g

  backend:
    image: ghcr.io/iread-b105/iread-backend:${BACKEND_TAG:-latest}
    container_name: iread-backend
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      ai: { condition: service_healthy }
    ports:
      # 루프백만. 외부 노출은 호스트 nginx가 담당한다.
      - "127.0.0.1:8080:8080"
    environment:
      TZ: Asia/Seoul
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-iread}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-iread}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      # Flyway 가 심은 training_templates 의 requiredInputs 가 TrainingInputPolicy 와 어긋나
      # "SYLLABLE_REPLACE requiredInputs는 []이어야 합니다" 같은 오류가 난다.
      # 이 플래그를 켜면 TrainingTemplateDataInitializer 가 기동 시 training-templates.json
      # 기준으로 DB 를 다시 맞춘다(synchronizeSeedContract). 멱등이라 매번 켜둬도 된다.
      IREAD_TRAINING_TEMPLATE_SEED_ENABLED: "true"
      # 시연용 학습 치트(다음날로 이동 등). demo 프로파일 전체를 켜지 않고 이것만 연다.
      # 기동 시 진행도를 지우는 초기화 빈은 @Profile("demo") 로 여전히 차단된다.
      IREAD_DEMO_CHEAT_ENABLED: "true"
      AI_BASE_URL: http://ai:8080
      AI_API_KEY: ${AI_INTERNAL_API_KEY:?}
      # application.properties 기본값이 전부 true 라서 명시적으로 꺼야 실제 AI가 호출된다.
      AI_MOCK_GENERATE: "false"
      AI_MOCK_STORY: "false"
      AI_MOCK_IMAGE: "false"
      AI_MOCK_EVALUATE: "false"
      AI_MOCK_SPEECH: "false"
      # 브라우저는 같은 출처라도 POST 에 Origin 헤더를 붙인다. 이 목록에 운영 도메인이
      # 없으면 로그인·회원가입이 "Invalid CORS request" 403 으로 막힌다.
      CORS_ALLOWED_ORIGINS: https://${PUBLIC_DOMAIN:?}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET 를 .env 에 설정해야 한다}
      # HTTPS 로 서비스하므로 쿠키에 Secure 를 붙인다.
      AUTH_COOKIE_SECURE: "true"
      AUTH_PASSWORD_RESET_FRONTEND_URL: https://${PUBLIC_DOMAIN:?PUBLIC_DOMAIN 를 .env 에 설정해야 한다}/reset-password
      AUTH_PASSWORD_RESET_FROM: ${AUTH_PASSWORD_RESET_FROM:-no-reply@iread.local}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      TYPECAST_API_KEY: ${TYPECAST_API_KEY:-}
      TYPECAST_API_KEY_1: ${TYPECAST_API_KEY_1:-}
      TYPECAST_API_KEY_2: ${TYPECAST_API_KEY_2:-}
      TYPECAST_API_KEY_3: ${TYPECAST_API_KEY_3:-}
      TYPECAST_API_KEY_4: ${TYPECAST_API_KEY_4:-}
    volumes:
      # application.properties 가 상대 경로를 쓰므로 WORKDIR(/app) 기준으로 마운트한다.
      - backend-uploads:/app/uploads
      - backend-audio:/app/audio
      - backend-gaze:/app/gaze
    mem_limit: 2g

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: iread-mailpit
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    ports:
      # 웹 UI 는 인증이 없으므로 루프백만. 보려면 SSH 터널을 쓴다:
      #   ssh -i I15B105T.pem -L 8025:127.0.0.1:8025 ubuntu@i15b105.p.ssafy.io
      - "127.0.0.1:8025:8025"
    mem_limit: 256m

volumes:
  mysql-data:
  redis-data:
  backend-uploads:
  backend-audio:
  backend-gaze:
