services:
  mysql:
    image: mysql:8.4
    container_name: iread-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: iread
      MYSQL_USER: ssafy
      MYSQL_PASSWORD: ssafy
      MYSQL_ROOT_PASSWORD: root1234
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot1234"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: iread-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-mock:
    image: wiremock/wiremock:3.13.2
    container_name: iread-ai-mock
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./mock-ai:/home/wiremock
    command: ["--global-response-templating", "--verbose"]

  backend:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iread-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/iread?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ssafy
      SPRING_DATASOURCE_PASSWORD: ssafy
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      AI_BASE_URL: http://ai-mock:8080
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET must be at least 32 bytes}
      AUTH_DEMO_VERIFICATION_CODE: ${AUTH_DEMO_VERIFICATION_CODE:-123456}
      AUTH_COOKIE_SECURE: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-mock:
        condition: service_started
    volumes:
      - backend-audio:/app/audio
      - backend-uploads:/app/uploads

volumes:
  mysql-data:
  redis-data:
  backend-audio:
  backend-uploads:
