services:
  mysql:
    image: mysql:8.4
    container_name: iread-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: iread
      MYSQL_USER: ssafy
      MYSQL_PASSWORD: ssafy
      MYSQL_ROOT_PASSWORD: root1234
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot1234"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: iread-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-mock:
    build:
      context: ../iRead-ai
      dockerfile: Dockerfile
    image: iread-ai-mock:local
    container_name: iread-ai-mock
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      # Backend의 AI_API_KEY와 같은 값을 사용한다.
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY:-}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-koreacentral}
      AZURE_SPEECH_LANGUAGE: ${AZURE_SPEECH_LANGUAGE:-ko-KR}
      AI_AUDIO_FFMPEG_PATH: ${AI_AUDIO_FFMPEG_PATH:-ffmpeg}
      AI_AUDIO_CONVERSION_TIMEOUT_SECONDS: ${AI_AUDIO_CONVERSION_TIMEOUT_SECONDS:-15}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: iread-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql-data:
  redis-data:
