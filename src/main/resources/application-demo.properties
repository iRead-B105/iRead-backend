spring.flyway.locations=classpath:db/migration,classpath:db/demo
iread.training-template-seed.enabled=true
iread.teacher-demo-seed.enabled=true
iread.all-training-showcase.enabled=true
iread.demo-training-reset.enabled=true
# 마이크 없이 발음 평가 경로를 확인하는 시험용 TTS 엔드포인트.
iread.training-tts-sample.enabled=true
# Keep the all-training demo seed deterministic. Other AI mock endpoints still use ai.base-url.
ai.mock-generate=${AI_MOCK_GENERATE:true}
ai.mock-evaluate=${AI_MOCK_EVALUATE:true}
ai.mock-speech=${AI_MOCK_SPEECH:true}
ai.mock-pronunciation=${AI_MOCK_PRONUNCIATION:${AI_MOCK_SPEECH:true}}
ai.mock-transcribe=${AI_MOCK_TRANSCRIBE:${AI_MOCK_SPEECH:true}}
ai.mock-tts=${AI_MOCK_TTS:${AI_MOCK_SPEECH:true}}
