spring.flyway.locations=classpath:db/migration,classpath:db/demo
iread.training-template-seed.enabled=true
iread.teacher-demo-seed.enabled=true
iread.qa-demo-dataset.allow-legacy-demo-identity=true
iread.demo-personalized-curriculum.enabled=true
iread.demo-training-reset.enabled=true
# 치트 빈이 @Profile("demo") 에서 이 플래그로 바뀌었으므로 demo 프로파일도 켜 준다.
# DemoTrainingProgressResetInitializer 가 DemoTrainingProgressResetService 를 주입받으므로
# 이 값이 없으면 demo 프로파일 기동이 실패한다.
iread.demo-cheat.enabled=true
# 한결의 첫 훈련을 음성 문항으로 고정해 발음 평가를 화면에서 확인한다.
iread.demo-voice-first-training.enabled=true
# 마이크 없이 발음 평가 경로를 확인하는 시험용 TTS 엔드포인트.
iread.training-tts-sample.enabled=true
# Keep the all-training demo seed deterministic. Other AI mock endpoints still use ai.base-url.
ai.mock-generate=${AI_MOCK_GENERATE:true}
ai.mock-story=${AI_MOCK_STORY:${AI_MOCK_GENERATE:true}}
ai.mock-image=${AI_MOCK_IMAGE:${AI_MOCK_GENERATE:true}}
ai.mock-evaluate=${AI_MOCK_EVALUATE:true}
ai.mock-speech=${AI_MOCK_SPEECH:true}
ai.mock-pronunciation=${AI_MOCK_PRONUNCIATION:${AI_MOCK_SPEECH:true}}
ai.mock-transcribe=${AI_MOCK_TRANSCRIBE:${AI_MOCK_SPEECH:true}}
ai.mock-tts=${AI_MOCK_TTS:${AI_MOCK_SPEECH:true}}
# 시연용 스토리 재생: 켜져 있으면 아기돼지 삼형제(템플릿 6) 생성 요청을
# qa-demo 완결본(280003)에서 씬 단위로 돌려주고, 합의 외 선택지는 실제 AI로 폴백한다.
# 실행 중에는 /api/app/dev/story-demo/toggle 치트로 켜고 끈다.
ai.demo-story.enabled=${AI_DEMO_STORY:false}
ai.demo-story.source-story-id=${AI_DEMO_STORY_SOURCE_ID:280003}
ai.demo-story.delay=${AI_DEMO_STORY_DELAY:5s}
