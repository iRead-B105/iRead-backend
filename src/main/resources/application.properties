spring.application.name=iread-backend
spring.config.import=optional:classpath:application-local.properties

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.file-storage.type=local
app.file-storage.local.upload-dir=uploads/images
app.file-storage.local.public-url=/uploads/images

ai.base-url=${AI_BASE_URL:http://localhost:8081}
ai.connect-timeout=${AI_CONNECT_TIMEOUT:3s}
ai.read-timeout=${AI_READ_TIMEOUT:30s}
ai.api-key=${AI_API_KEY:}
ai.mock-generate=${AI_MOCK_GENERATE:true}
ai.mock-evaluate=${AI_MOCK_EVALUATE:true}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true
