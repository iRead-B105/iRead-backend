spring.application.name=iread-backend
spring.config.import=optional:classpath:application-local.properties
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.mvc.log-request-details=false
server.tomcat.accesslog.enabled=false

# nginx 뒤에 있으면 이게 없으면 Spring 이 요청을 http 로 인식한다. 그러면 브라우저가 보낸
# Origin(https://...) 과 스킴이 어긋나 같은 출처인데도 교차 출처로 판정되어 CORS 에서 403 이 난다.
server.forward-headers-strategy=framework

# 운영에서는 CORS_ALLOWED_ORIGINS 로 실제 도메인을 넣는다. 기본값은 로컬 개발용이다.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173}

# 배포 헬스체크용. health 외의 actuator 엔드포인트는 노출하지 않는다.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

auth.jwt.secret=${AUTH_JWT_SECRET:}
auth.jwt.access-token-ttl=${AUTH_ACCESS_TOKEN_TTL:3h}
auth.jwt.bootstrap-token-ttl=5m
auth.refresh-token-ttl=${AUTH_REFRESH_TOKEN_TTL:3h}
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.password-reset.token-ttl=10m
auth.password-reset.frontend-url=${AUTH_PASSWORD_RESET_FRONTEND_URL:http://localhost:5173/reset-password}
auth.password-reset.from=${AUTH_PASSWORD_RESET_FROM:no-reply@iread.local}
auth.password-reset.rate-limit.max-requests=5
auth.password-reset.rate-limit.window=15m

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
app.file-storage.type=local
app.file-storage.local.upload-dir=uploads/images
app.file-storage.local.public-url=/uploads/images
app.audio-storage.local.upload-dir=audio
app.gaze-storage.local.upload-dir=gaze
app.gaze-storage.local.public-url=/gaze
app.audio-upload.max-size=20MB
app.audio-upload.allowed-content-types=audio/webm,audio/wav,audio/mpeg,audio/mp4
app.audio-upload.temp-dir=${java.io.tmpdir}/iread-audio

ai.base-url=${AI_BASE_URL:http://localhost:8081}
ai.connect-timeout=${AI_CONNECT_TIMEOUT:3s}
ai.read-timeout=${AI_READ_TIMEOUT:210s}
ai.api-key=${AI_API_KEY:}
ai.mock-generate=${AI_MOCK_GENERATE:true}
ai.mock-story=${AI_MOCK_STORY:${AI_MOCK_GENERATE:true}}
ai.mock-image=${AI_MOCK_IMAGE:${AI_MOCK_GENERATE:true}}
ai.mock-evaluate=${AI_MOCK_EVALUATE:true}
# ai.mock-speech은 발음 평가·STT·TTS의 기본값이다.
# 기능별로 덮어쓰려면 AI_MOCK_PRONUNCIATION, AI_MOCK_TRANSCRIBE, AI_MOCK_TTS 환경 변수를 지정한다.
# 필요한 기능만 실제 연동하려면 기능별 mock 환경변수를 false로 지정한다.
ai.mock-speech=${AI_MOCK_SPEECH:true}

typecast.base-url=${TYPECAST_API_BASE_URL:https://api.typecast.ai}
typecast.api-key=${TYPECAST_API_KEY:}
# 할당량 소진 시 자동 전환용 키 목록(줄 단위, 최대 4개).
# 연속 2회 할당량 오류(402/403/429)면 다음 키로 순환 전환한다.
typecast.api-key-1=${TYPECAST_API_KEY_1:}
typecast.api-key-2=${TYPECAST_API_KEY_2:}
typecast.api-key-3=${TYPECAST_API_KEY_3:}
typecast.api-key-4=${TYPECAST_API_KEY_4:}
typecast.voice-id=${TYPECAST_VOICE_ID:tc_619d7f42c14fccfc4953e159}
typecast.voice-name=${TYPECAST_VOICE_NAME:Beri}
typecast.model=${TYPECAST_MODEL:ssfm-v30}
typecast.connect-timeout=${TYPECAST_CONNECT_TIMEOUT:3s}
typecast.read-timeout=${TYPECAST_READ_TIMEOUT:30s}

word-attempt.score.retry-penalty=${WORD_ATTEMPT_RETRY_PENALTY:100}
word-attempt.score.pronunciation-threshold=${WORD_ATTEMPT_PRONUNCIATION_THRESHOLD:70}
word-attempt.score.incorrect-penalty=${WORD_ATTEMPT_INCORRECT_PENALTY:200}
word-attempt.score.skipped-penalty=${WORD_ATTEMPT_SKIPPED_PENALTY:600}
word-attempt.score.gaze-regression-penalty=${WORD_ATTEMPT_GAZE_REGRESSION_PENALTY:100}
word-attempt.score.pronunciation-weight=${WORD_ATTEMPT_PRONUNCIATION_WEIGHT:50}
word-attempt.score.gaze-weight=${WORD_ATTEMPT_GAZE_WEIGHT:30}
word-attempt.score.task-weight=${WORD_ATTEMPT_TASK_WEIGHT:20}

# 나의 성장 단계는 완료 노력, 훈련 다양성, 숙달도를 함께 사용한다.
# 완료 이력을 시간순으로 재생해 최고 도달 단계를 유지하므로 최근 점수가 낮아져도 단계가 하락하지 않는다.
growth.stage.recent-window-size=${GROWTH_RECENT_WINDOW_SIZE:10}
growth.stage.mastery-accuracy=${GROWTH_MASTERY_ACCURACY:70}
growth.stage.sprout-completed=${GROWTH_SPROUT_COMPLETED:3}
growth.stage.sprout-distinct-templates=${GROWTH_SPROUT_DISTINCT_TEMPLATES:2}
growth.stage.bud-completed=${GROWTH_BUD_COMPLETED:8}
growth.stage.bud-coverage-percent=${GROWTH_BUD_COVERAGE_PERCENT:25}
growth.stage.flower-completed=${GROWTH_FLOWER_COMPLETED:15}
growth.stage.flower-coverage-percent=${GROWTH_FLOWER_COVERAGE_PERCENT:50}
growth.stage.flower-recent-accuracy=${GROWTH_FLOWER_RECENT_ACCURACY:70}
growth.stage.full-bloom-completed=${GROWTH_FULL_BLOOM_COMPLETED:25}
growth.stage.full-bloom-mastery-coverage-percent=${GROWTH_FULL_BLOOM_MASTERY_COVERAGE_PERCENT:70}
growth.stage.full-bloom-recent-accuracy=${GROWTH_FULL_BLOOM_RECENT_ACCURACY:80}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true
