spring.datasource.url=jdbc:h2:mem:iread-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.data.redis.repositories.enabled=false
iread.training-template-seed.enabled=false

app.file-storage.type=local
app.file-storage.local.upload-dir=build/test-uploads
app.file-storage.local.public-url=/test-uploads
app.gaze-storage.local.upload-dir=build/test-gaze
app.gaze-storage.local.public-url=/test-gaze

ai.base-url=http://localhost:8081
ai.connect-timeout=3s
ai.read-timeout=30s
ai.api-key=test-api-key
ai.mock-generate=true
ai.mock-evaluate=true

typecast.base-url=https://api.typecast.ai
typecast.api-key=
typecast.voice-id=tc_619d7f42c14fccfc4953e159
typecast.voice-name=Beri
typecast.model=ssfm-v30
typecast.connect-timeout=3s
typecast.read-timeout=30s

word-attempt.score.retry-penalty=100
word-attempt.score.pronunciation-threshold=70
word-attempt.score.incorrect-penalty=200
word-attempt.score.skipped-penalty=600
word-attempt.score.gaze-regression-penalty=100
word-attempt.score.pronunciation-weight=50
word-attempt.score.gaze-weight=30
word-attempt.score.task-weight=20

growth.stage.recent-window-size=10
growth.stage.mastery-accuracy=70
growth.stage.sprout-completed=3
growth.stage.sprout-distinct-templates=2
growth.stage.bud-completed=8
growth.stage.bud-coverage-percent=25
growth.stage.flower-completed=15
growth.stage.flower-coverage-percent=50
growth.stage.flower-recent-accuracy=70
growth.stage.full-bloom-completed=25
growth.stage.full-bloom-mastery-coverage-percent=70
growth.stage.full-bloom-recent-accuracy=80

auth.jwt.secret=test-secret-that-is-at-least-32-bytes-long
auth.jwt.access-token-ttl=15m
auth.jwt.bootstrap-token-ttl=5m
auth.refresh-token-ttl=14d
auth.cookie.secure=false
auth.demo.verification-code=123456
